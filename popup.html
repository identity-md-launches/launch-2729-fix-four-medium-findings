<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Squeektoshi Status</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img id="face" src="icons/idle-128.png" alt="" width="56" height="56" />
    <div>
      <h1 id="title">Checking the wheel…</h1>
      <p id="sub">one sec</p>
    </div>
  </header>

  <section class="grid">
    <div class="stat"><span class="label">speed</span><span class="val" id="speed">–</span></div>
    <div class="stat"><span class="label">distance today</span><span class="val" id="distance">–</span></div>
    <div class="stat"><span class="label">block height</span><span class="val" id="height">–</span></div>
    <div class="stat"><span class="label">last ran</span><span class="val" id="lastRun">–</span></div>
  </section>

  <section class="day">
    <div class="day-head">
      <span class="label">last 24h</span>
      <span class="totals"><b id="blocks24">–</b> blocks · <b id="sqk24">–</b> SQK</span>
    </div>
    <div id="bars" class="bars" aria-label="Work per hour, last 24 hours"></div>
    <div class="axis"><span>24h ago</span><span>now</span></div>
  </section>

  <label class="toggle">
    <input type="checkbox" id="notify" checked />
    <span>ping me when Squeektoshi wakes up</span>
  </label>

  <footer>
    <a href="https://x.com/squeektoshi" target="_blank" rel="noopener">watch the hamster</a>
    <span>·</span>
    <a href="https://docs.squeekchain.com" target="_blank" rel="noopener">docs</a>
    <span class="net">sepolia testnet</span>
  </footer>
  <p id="updated" class="updated"></p>

  <script type="module" src="popup.js"></script>
</body>
</html>
